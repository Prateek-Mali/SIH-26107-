# BIS Assistant: list of sources to download
# scripts/download.py reads this file and downloads everything automatically.
# Every source is an official BIS or Government of India page. All were checked on 26 Sep 2026.
#
# type:     pdf  = download the file
#           html = save the page text
#           table_scrape = read the table on the page into a CSV and download every PDF linked in it
# agent:    which agent's knowledge this belongs to (law | certification | product_qco | hallmarking_consumer)
# priority: 1 = must have for the first demo, 2 = add next

download_rules:
  user_agent: "BIS-Assistant-Student-Project/0.1 (educational, SIH26107)"
  delay_seconds: 2            # wait between requests; never hammer government servers
  respect_robots_txt: true
  retries: 3
  skip_if_exists: true        # keep a local cache; do not re-download
  never:
    - bypass CAPTCHA or login pages
    - download paid ISO/IEC-adopted standards
    - republish full standard text (cite and link instead: BIS copyright)
  on_failure: "log to data/download_log.csv and continue; do not stop the whole run"

