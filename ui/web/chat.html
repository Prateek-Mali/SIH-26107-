<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIS Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--bg:#F6F4EF;--side:#EFECE5;--line:#E4E0D6;--line2:#D9D4C8;--ink:#1A1A17;--ink2:#3E3C36;--muted:#5E5B53;--faint:#8A867C;
  --green:#1F4D3A;--green-dark:#163828;--green-soft:#E3ECE6;--hover:#EDEAE2;--card:#FFFFFF;--red:#8A2A12}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--green);text-decoration:none}a:hover{color:var(--green-dark)}
*{box-sizing:border-box}
textarea:focus{outline:none}button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@keyframes pdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
button{font:inherit;cursor:pointer}
.app{height:100vh;display:flex;overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(26,26,23,.35);z-index:9;display:none}
aside{z-index:10;top:0;bottom:0;left:0;width:280px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);padding:16px 16px 12px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--green);display:grid;place-items:center;color:var(--bg);font-family:'Instrument Serif',serif;font-size:20px;line-height:1}
.brand span{font-weight:600;font-size:16px}
.new{margin:0 12px 12px;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--card);font-size:14px;font-weight:500;color:var(--ink)}
.new:hover{border-color:var(--green)}
.label{padding:8px 20px 6px;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
nav{flex:1;overflow-y:auto;padding:0 8px;display:flex;flex-direction:column;gap:2px}
.conv{display:flex;align-items:center;border-radius:10px}
.conv.active{background:var(--card);box-shadow:0 1px 2px rgba(40,35,20,.06)}
.conv:not(.active):hover{background:#E6E2D9}
.conv .t{flex:1;min-width:0;height:44px;padding:0 12px;border:0;background:transparent;text-align:left;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.active .t{font-weight:500;color:var(--ink)}
.conv .x{flex:none;width:36px;height:36px;margin-right:4px;border:0;border-radius:8px;background:transparent;color:var(--faint);font-size:16px;display:none}
.conv.active .x{display:block}.conv .x:hover{background:#F3F0EA;color:var(--red)}
.foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.45;color:var(--muted)}
.foot b{font-weight:600;color:var(--ink)}
.me{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.initial{flex:none;width:36px;height:36px;border-radius:50%;background:var(--green);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:600}
.me span{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me button{flex:none;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:transparent;font-size:13px;color:var(--ink)}
.me button:hover{background:#E6E2D9}
main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
header{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
.menu{width:44px;height:44px;margin-left:-10px;border:0;border-radius:10px;background:transparent;font-size:20px;color:var(--ink);display:none}
.menu:hover{background:var(--hover)}
.title{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto}
.thread{max-width:760px;margin:0 auto;padding:32px 20px 24px;display:flex;flex-direction:column;gap:24px;min-height:100%}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:40px 0}
.empty h1{margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,5vw,52px);line-height:1.05;letter-spacing:-.01em}
.empty h1 span{color:var(--muted)}
.sugg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.sugg button{min-height:64px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;font-size:14px;line-height:1.4;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.sugg button:hover{border-color:var(--green)}.sugg b{font-weight:500}.sugg span{color:var(--muted)}
.user{align-self:flex-end;max-width:min(80%,560px);background:var(--green);color:var(--bg);padding:12px 16px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.bot{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:30px;height:30px;border-radius:9px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-family:'Instrument Serif',serif;font-size:19px}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.md{font-size:15px;line-height:1.65;color:var(--ink);word-wrap:break-word;padding-top:4px}
.md p{margin:0 0 .6em}.md p:last-child{margin-bottom:0}.md ul,.md ol{margin:.2em 0 .6em;padding-left:1.3em}.md li{margin:.15em 0}
.md table{border-collapse:collapse;margin:.4em 0 .8em;font-size:14px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line2);padding:6px 10px;text-align:left;vertical-align:top}.md th{background:var(--side);font-weight:600}
.md h1,.md h2,.md h3,.md h4{font-size:15px;margin:.8em 0 .3em}
.cite{font-size:11px;font-weight:600;vertical-align:super;line-height:0;padding:0 1px;color:var(--green);cursor:pointer}
.sources{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.src{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px;line-height:1.4;color:var(--ink)}
.src:hover{border-color:var(--green);color:var(--ink)}.src.flash{border-color:var(--green);background:var(--green-soft)}
.src .n{flex:none;width:22px;height:22px;border-radius:6px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:12px;font-weight:600}
.src .m{color:var(--muted);font-size:12px}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.actions button{height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:12px;color:var(--muted)}
.actions button:hover{background:var(--hover)}
.meta{font-size:12px;color:var(--faint);align-self:center}.fallback{color:var(--red)}
.trace{font-size:12px;line-height:1.5;color:var(--muted);background:var(--side);border-radius:10px;padding:10px 12px;display:none;white-space:pre-wrap;word-break:break-word}
.dots{display:flex;gap:5px;padding:8px 0}.dots span{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pdot 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.composer{flex:none;padding:0 20px 20px}
form{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:0 10px 30px -18px rgba(40,35,20,.25)}
form:focus-within{border-color:var(--green)}
textarea{flex:1;min-height:40px;max-height:200px;padding:10px 0;border:0;resize:none;background:transparent;font:inherit;font-size:15px;line-height:1.45;color:var(--ink)}
.send{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--green);color:var(--bg);font-size:18px}
.send:disabled{background:#B9C7BF;cursor:default}
.attach{flex:none;width:40px;height:40px;margin-left:-8px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center}
.attach:hover{background:var(--hover);color:var(--ink)}
.preview{max-width:760px;margin:0 auto 8px;display:none;align-items:center;gap:10px;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--muted)}
.preview img{width:44px;height:44px;object-fit:cover;border-radius:10px;background:var(--side)}
.preview span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview button{border:0;background:transparent;color:var(--faint);font-size:16px;width:32px;height:32px;border-radius:8px}
.preview button:hover{background:var(--hover);color:var(--ink)}
.user img{display:block;max-width:220px;max-height:220px;border-radius:12px;margin-bottom:8px}
.seen{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.seen b{display:block;color:var(--green);font-weight:600;margin-bottom:4px}
.seen ul{margin:6px 0 0;padding-left:1.2em}.seen .bad{color:#8A2A12}.seen .q{color:var(--muted);font-size:13px;margin-top:6px}
.hint{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:819px){aside{position:fixed;display:none}aside.open{display:flex}.scrim.open{display:block}.menu{display:block}}
</style>
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside id="side">
    <a class="brand" href="./"><div class="logo">B</div><span>BIS Assistant</span></a>
    <button class="new" id="newChat"><span style="font-size:18px;line-height:1">+</span> New conversation</button>
    <div class="label">Recent</div>
    <nav id="convs"></nav>
    <div class="foot"><span><b>BIS Assistant</b> · Answers from official BIS documents</span><em>Not an official BIS service</em></div>
    <div class="me"><div class="initial" id="initial">?</div><span id="email"></span><button id="logout">Log out</button></div>
  </aside>
  <main>
    <header><button class="menu" id="menu" aria-label="Open conversations">☰</button><span class="title" id="title">New conversation</span></header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="composer">
      <div class="preview" id="preview"><img id="previewImg" alt=""><span id="previewName"></span>
        <button type="button" id="removePhoto" aria-label="Remove photo">×</button></div>
      <form id="form">
        <button class="attach" type="button" id="attach" aria-label="Add a product photo" title="Add a product photo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/heic,.heic" hidden>
        <textarea id="input" rows="1" placeholder="Ask about standards, certification or hallmarking…" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>↑</button>
      </form>
      <p class="hint">Enter to send · Shift + Enter for a new line · Answers cite official BIS documents</p>
    </div>
  </main>
</div>
<script>
const SUGG = [
  {title: 'Find my standard', sub: 'Which IS applies to steel water bottles?'},
  {title: 'Is it compulsory?', sub: 'Do LED bulbs need BIS certification?'},
  {title: 'Get certified', sub: 'Steps to get an ISI licence for my product'},
  {title: 'Check gold jewellery', sub: 'How do I verify a HUID hallmark?'},
];
const $ = id => document.getElementById(id);
const state = {sid: null, busy: false, messages: [], sessions: []};
const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
function body(answer) { return String(answer || '').split(/\n\n\*\*(?:Sources|स्रोत):\*\*/)[0]; }   // sources shown as cards
function savedSources(answer) {   // a stored answer keeps its source list as text: "[1] Title: section, p. 3 | url"
  const list = String(answer || '').split(/\n\n\*\*(?:Sources|स्रोत):\*\*\n/)[1] || '';
  return list.split('\n').map(l => l.match(/^\[(\d+)\] (.+?)(?:: (.+))? \| (\S+)$/)).filter(Boolean)
             .map(m => ({n: +m[1], title: m[2], section: m[3] || '', url: m[4]}));
}
function seenCard(d) {   // "What I see in your photo" from the vision event (the answer text then skips that paragraph)
  const v = d.vision || {}, marks = (v.marks || []).map(m => m.type + ' mark').join(', ') || 'no certification mark visible';
  const checks = (d.format_checks || []).map(c => `<li class="${c.valid_format ? '' : 'bad'}">${esc(c.field.replace('_', ' '))} <b style="display:inline;color:inherit">${esc(c.value)}</b>: format ${c.valid_format ? 'looks right' : 'does not match'}</li>`).join('');
  const nums = [['is_number_on_label', 'IS number'], ['cml_number', 'Licence'], ['r_number', 'Registration'], ['huid', 'HUID'], ['purity', 'Purity']]
    .filter(([k]) => v[k]).map(([k, l]) => `${l} ${esc(v[k])}`).join(' · ');
  return `<div class="seen"><b>What I see in your photo</b>${esc(v.product_type || v.product_description || 'No product')} · ${esc(marks)}
    ${nums ? `<div>${nums}</div>` : ''}${checks ? `<ul>${checks}</ul>` : ''}
    ${v.image_quality && v.image_quality !== 'good' ? `<div class="q">Photo ${esc(v.image_quality)}${v.notes ? ': ' + esc(v.notes) : ''}</div>` : ''}</div>`;
}
function renderMd(text, key) {
  const html = DOMPurify.sanitize(marked.parse(body(text), {breaks: true}));
  return html.replace(/\[(\d+)\]/g, (m, n) => `<span class="cite" data-k="${key}" data-n="${n}">[${n}]</span>`);
}
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning.' : h < 18 ? 'Good afternoon.' : 'Good evening.';
}

function render() {
  const t = $('thread');
  if (!state.messages.length && !state.busy) {
    t.innerHTML = `<div class="empty"><h1>${greeting()}<br><span>What would you like to know about BIS?</span></h1>
      <div class="sugg">${SUGG.map((s, i) => `<button data-s="${i}"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></button>`).join('')}</div></div>`;
    t.querySelectorAll('[data-s]').forEach(b => b.onclick = () => send(SUGG[b.dataset.s].sub));
  } else {
    t.innerHTML = state.messages.map((m, i) => m.role === 'user'
      ? `<div class="user">${m.image ? `<img src="${m.image}" alt="Your photo">` : ''}${esc(m.content)}</div>`
      : `<div class="bot"><div class="av">B</div><div class="body">
           ${m.vision ? seenCard(m.vision) : ''}
           <div class="md">${m.pending && !m.content ? '<div class="dots"><span></span><span></span><span></span></div>' : renderMd(m.vision ? m.content.replace(/^\*\*What I see in your photo:\*\*[\s\S]*?\n\n/, '') : m.content, i)}</div>
           ${(m.citations || []).length ? `<div class="sources">${m.citations.map(c => `
             <a class="src" id="src-${i}-${c.n}" href="${esc(c.url)}" target="_blank" rel="noopener"><span class="n">${c.n}</span>
             <span><span>${esc(c.title)}</span><br><span class="m">${esc([c.section, c.page ? 'p. ' + c.page : '', c.doc_date ? 'dated ' + c.doc_date : ''].filter(Boolean).join(' · '))}</span></span></a>`).join('')}</div>` : ''}
           ${m.pending ? '' : `<div class="actions"><button data-copy="${i}">Copy</button>${m.trace ? `<button data-trace="${i}">How I answered</button>` : ''}
             ${m.meta ? `<span class="meta${m.fallback ? ' fallback' : ''}">${esc(m.meta)}</span>` : ''}</div>
             ${m.trace ? `<div class="trace" id="trace-${i}">${esc(m.trace)}</div>` : ''}`}
         </div></div>`).join('');
    t.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
      navigator.clipboard?.writeText(body(state.messages[b.dataset.copy].content)).catch(() => {});
      b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500);
    });
    t.querySelectorAll('[data-trace]').forEach(b => b.onclick = () => {
      const el = $('trace-' + b.dataset.trace); el.style.display = el.style.display === 'block' ? 'none' : 'block';
    });
    t.querySelectorAll('.cite').forEach(c => c.onclick = () => {
      const el = $(`src-${c.dataset.k}-${c.dataset.n}`); if (!el) return;
      el.scrollIntoView({block: 'nearest', behavior: 'smooth'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
    });
  }
  const cur = state.sessions.find(s => s.session_id === state.sid);
  $('title').textContent = cur ? cur.title : (state.messages[0]?.content.slice(0, 48) || 'New conversation');
  $('send').disabled = state.busy || (!$('input').value.trim() && !state.photo);
  $('scroll').scrollTop = $('scroll').scrollHeight;
}

function renderSessions() {
  $('convs').innerHTML = state.sessions.map(s => `<div class="conv${s.session_id === state.sid ? ' active' : ''}">
    <button class="t" data-open="${esc(s.session_id)}">${esc(s.title || 'Conversation')}</button>
    <button class="x" data-del="${esc(s.session_id)}" aria-label="Delete conversation">×</button></div>`).join('');
  $('convs').querySelectorAll('[data-open]').forEach(b => b.onclick = () => openSession(b.dataset.open));
  $('convs').querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeSession(b.dataset.del));
}

function toLogin() { location.replace('login.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search)); }
async function api(url, opts) {   // every call: a 401 (signed out / expired) goes to the sign-in page
  const r = await fetch(url, opts);
  if (r.status === 401) { toLogin(); throw new Error('signed out'); }
  return r;
}

async function loadSessions() {
  try { state.sessions = (await (await api('/sessions')).json()).filter(s => s.turns > 0); } catch (e) { state.sessions = []; }
  renderSessions();
}

function traceText(tr) {
  const st = (tr && tr.stages) || {};
  const lines = [];
  if (st.rewritten_question) lines.push('Understood as: ' + st.rewritten_question);
  if (st.tools && st.tools.length) lines.push('Tools used: ' + st.tools.join(' → '));
  if (st.sub_queries && st.sub_queries.length) lines.push('Searched for: ' + st.sub_queries.join(' | '));
  if (st.sent_to_llm) lines.push(`Read ${st.sent_to_llm.length} excerpts from official documents`);
  if (st.removed && st.removed.length) lines.push(`Removed ${st.removed.length} sentence(s) the documents did not support`);
  if (st.refusal_reason) lines.push('Not answered: ' + st.refusal_reason.replace(/_/g, ' '));
  return lines.join('\n');
}

async function openSession(sid) {
  closeSide();
  if (state.busy) return;
  try {
    const d = await (await api('/session/' + encodeURIComponent(sid))).json();
    state.sid = sid;
    state.messages = d.turns.map(t => ({role: t.role, content: t.content, citations: t.role === 'user' ? [] : savedSources(t.content)}));
  } catch (e) { return; }
  store.set('bis.session', sid);
  renderSessions(); render();
}

async function removeSession(sid) {
  await api('/session/' + encodeURIComponent(sid), {method: 'DELETE'}).catch(() => {});
  if (sid === state.sid) newChat();
  loadSessions();
}

function newChat() {
  closeSide();
  if (state.busy) return;
  state.sid = null; state.messages = [];
  store.set('bis.session', null);
  renderSessions(); render(); $('input').focus();
}

async function send(text) {
  text = (text || '').trim();
  const photo = state.photo;
  if ((!text && !photo) || state.busy) return;
  let image = {};
  if (photo) {
    image = {image_base64: await new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsDataURL(photo.file); }),
             image_name: photo.file.name || 'photo.jpg'};
    clearPhoto();
  }
  state.messages.push({role: 'user', content: text, image: photo && photo.url});
  const bot = {role: 'bot', content: '', pending: true};
  state.messages.push(bot);
  state.busy = true; $('input').value = ''; autosize(); render();
  try {
    const res = await api('/chat/stream', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                             body: JSON.stringify({message: text, session_id: state.sid, ...image})});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const events = buf.split(/\r?\n\r?\n/); buf = events.pop();
      for (const raw of events) {
        const ev = (raw.match(/^event: ?(.*)$/m) || [])[1];
        const data = raw.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
        if (!ev || !data) continue;
        const d = JSON.parse(data);
        if (ev === 'token') { bot.content += d.text; render(); }
        else if (ev === 'citations') bot.citations = d;
        else if (ev === 'trace') bot.trace = traceText(d);
        else if (ev === 'vision') bot.vision = d;
        else if (ev === 'error') bot.content = "I couldn't answer just now: " + d.message;
        else if (ev === 'done') {
          state.sid = d.session_id || state.sid; store.set('bis.session', state.sid);
          bot.fallback = !!d.fallback;
          bot.meta = d.fallback ? 'FALLBACK: ' + d.fallback : (d.latency_ms ? (d.latency_ms / 1000).toFixed(1) + ' s' : '');
        }
      }
    }
  } catch (e) {
    bot.content = "I couldn't reach the BIS Assistant server. Check that it is running and try again.";
  }
  bot.pending = false; state.busy = false;
  render(); loadSessions();
}

function autosize() { const ta = $('input'); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; }
function closeSide() { $('side').classList.remove('open'); $('scrim').classList.remove('open'); }

$('form').onsubmit = e => { e.preventDefault(); send($('input').value); };
$('input').oninput = () => { autosize(); canSend(); };
function canSend() { $('send').disabled = state.busy || (!$('input').value.trim() && !state.photo); }
function clearPhoto() { state.photo = null; $('file').value = ''; $('preview').style.display = 'none'; canSend(); }
$('attach').onclick = () => $('file').click();
$('removePhoto').onclick = clearPhoto;
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { alert('The photo is larger than 10 MB. Please choose a smaller one.'); $('file').value = ''; return; }
  state.photo = {file: f, url: URL.createObjectURL(f)};
  $('previewImg').src = state.photo.url; $('previewName').textContent = f.name;
  $('preview').style.display = 'flex'; canSend(); $('input').focus();
};
$('input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($('input').value); } };
$('newChat').onclick = newChat;
$('menu').onclick = () => { $('side').classList.add('open'); $('scrim').classList.add('open'); };
$('scrim').onclick = closeSide;

$('logout').onclick = async () => { await fetch('/auth/logout', {method: 'POST'}).catch(() => {}); store.set('bis.session', null); location.replace('./'); };

(async () => {
  const me = await fetch('/auth/me').catch(() => null);
  if (!me || !me.ok) return toLogin();
  const {email} = await me.json();
  $('email').textContent = email; $('initial').textContent = email[0].toUpperCase();
  await loadSessions();
  const q = new URLSearchParams(location.search).get('q');
  const last = store.get('bis.session');
  if (last && !q && state.sessions.some(s => s.session_id === last)) await openSession(last); else render();
  if (q) send(q);
  $('input').focus();
})();
</script>
